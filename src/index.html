<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Md2Word - Markdown 转 Word</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 560px;
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #333; font-size: 28px; margin-bottom: 8px; }
    .header p { color: #666; font-size: 14px; }
    .file-area { margin-bottom: 25px; }
    .file-input { display: flex; gap: 10px; }
    .file-path {
      flex: 1; padding: 12px 15px; border: 2px dashed #ccc;
      border-radius: 8px; background: #f9f9f9; color: #666;
      font-size: 13px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; max-width: 0;
    }
    .file-path.has-file { border-color: #667eea; background: #f0f3ff; color: #333; max-width: 100%; }
    .btn {
      padding: 12px 24px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.3s; white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
    .preview { margin-bottom: 25px; }
    .preview-label { display: block; color: #666; font-size: 14px; margin-bottom: 10px; }
    .preview-content {
      width: 100%; height: 180px; padding: 15px;
      border: 2px solid #eee; border-radius: 8px;
      font-size: 13px; color: #333; resize: vertical; background: #fafafa;
    }
    .preview-content:focus { outline: none; border-color: #667eea; }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .status {
      text-align: center; margin-top: 15px; padding: 10px;
      border-radius: 6px; font-size: 14px; display: none;
    }
    .status.success { display: block; background: #d4edda; color: #155724; }
    .status.error { display: block; background: #f8d7da; color: #721c24; }
    .footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
    .features {
      background: #f8f9ff; border-radius: 8px; padding: 15px; margin-top: 15px;
      font-size: 12px; color: #666; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .features span::before { content: "✓ "; color: #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Md2Word</h1>
      <p>Markdown → Word 文档转换器</p>
    </div>

    <div class="file-area">
      <div class="file-input">
        <div class="file-path" id="filePath">请选择 Markdown 文件...</div>
        <button class="btn btn-primary" id="selectBtn">选择文件</button>
      </div>
    </div>

    <div class="preview">
      <label class="preview-label">文件预览：</label>
      <textarea class="preview-content" id="preview" readonly placeholder="选择文件后将在此显示内容预览..."></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="convertBtn" disabled>转换为 Word</button>
    </div>

    <div class="status" id="status"></div>

    <div class="features">
      <span>支持粗体、斜体、删除线</span>
      <span>支持代码与代码块</span>
      <span>支持有序/无序列表</span>
      <span>支持表格（含对齐）</span>
      <span>支持图片嵌入 Word</span>
      <span>支持引用块</span>
    </div>

    <div class="footer">支持 .md, .markdown, .txt 格式</div>
  </div>

  <script>
    let currentFile = null;

    const filePathEl  = document.getElementById('filePath');
    const previewEl   = document.getElementById('preview');
    const selectBtn   = document.getElementById('selectBtn');
    const convertBtn  = document.getElementById('convertBtn');
    const statusEl    = document.getElementById('status');

    selectBtn.addEventListener('click', async () => {
      const result = await window.electronAPI.openFile();
      if (result) {
        currentFile = result;
        filePathEl.textContent = result.filePath;
        filePathEl.classList.add('has-file');
        previewEl.value = result.content.substring(0, 3000) + (result.content.length > 3000 ? '\n\n[...]' : '');
        convertBtn.disabled = false;
        statusEl.className = 'status';
        statusEl.textContent = '';
      }
    });

    convertBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      convertBtn.disabled = true;
      convertBtn.textContent = '转换中...';
      try {
        const result = await window.electronAPI.convertMdToDocx(currentFile.content, currentFile.filePath);
        if (result.success) {
          const saveResult = await window.electronAPI.saveFile(result.buffer, currentFile.filePath);
          if (saveResult.success) {
            statusEl.className = 'status success';
            statusEl.textContent = '✓ 转换成功！文件已保存至: ' + saveResult.filePath;
          } else {
            statusEl.className = 'status error';
            statusEl.textContent = '✗ 保存文件失败: ' + saveResult.error;
          }
        } else {
          statusEl.className = 'status error';
          statusEl.textContent = '✗ 转换失败: ' + result.error;
        }
      } catch (e) {
        statusEl.className = 'status error';
        statusEl.textContent = '✗ 转换失败: ' + e.message;
      }
      convertBtn.disabled = false;
      convertBtn.textContent = '转换为 Word';
    });
  </script>
</body>
</html>
